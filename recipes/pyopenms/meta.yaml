{% set name = "pyopenms" %}
{% set version = "3.4.1" %} # if ends with 'dev' it is considered a development release and pulled from GitHub
package:
  name: {{ name|lower  }}
  version: {{ version  }}

source:
  url: https://github.com/OpenMS/OpenMS/releases/download/release%2F3.2.0/OpenMS-3.2.0.tar.gz
  md5: e15b34a4ccaf7070d186fd01a6d57f3e

build:
  skip: True  # [py2k or osx]
  number: 1
  run_exports:
    - {{ pin_subpackage("pyopenms", max_pin="x.x") }}  

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - cmake
    - sysroot_linux-64 =2.17 # [linux]
    - ninja
  host:
    - eigen >=3.3.4
    - libopenms >={{ version }}
    - llvm-openmp # [osx]
    - libsvm >=335
    - xerces-c >=3.2
    - libboost-devel
    - qt6-main
    - python
    - cython >=0.25.2,<3.1
    - autowrap >=0.22.10
    - setuptools
    - wheel
    - pip
    - numpy >=1.23.*
    - pandas
    - matplotlib-base
    - sysroot_linux-64 =2.17 # [linux]
  run: # run_exports in libopenms should take care of the libraries. But it does not because of bugs. So copy everthing again and again
    - libopenms >={{ version }}
    - llvm-openmp # [osx]
    - libsvm >=335
    - xerces-c >=3.2
    - python
    - numpy >=1.23.*
    - pandas
    - matplotlib-base
    - sysroot_linux-64 =2.17 # [linux]
test:
  commands:
    - python -c "import pyopenms; print(pyopenms.__version__)"
    # We cant use the PYTHON variable since it does not exist on the biocontainer?!
    # TODO run the full test suite?

about:
  home: https://github.com/OpenMS/OpenMS
  license: BSD
  license_file: LICENSE
  summary: python bindings for OpenMS, an open-source software C++ library for LC-MS data management and analyses

extra:
    {% if 'dev' in version %}
  skip-lints:
    - uses_vcs_url
    - missing_hash
  {% endif %}
  identifiers:  
    - biotools:openms
    - doi:10.1038/nmeth.3959
