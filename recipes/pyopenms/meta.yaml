{% set name = "pyopenms" %}
{% set version = "3.4.1.dev" %} # if ends with 'dev' it is considered a development release and pulled from GitHub
package:
  name: {{ name|lower  }}
  version: {{ version  }}

source:
{% if 'dev' in version %}
  git_url: https://github.com/OpenMS/OpenMS.git
  git_rev: develop
{% else %}
  url: https://github.com/OpenMS/OpenMS/releases/download/release%2F3.4.1/OpenMS-3.4.1.tar.gz
  md5: 8d0b4d1d333f069959f7d5ff1c77a90f
{% endif %}

build:
  skip: True  # [py2k or osx]
  number: 1
  run_exports:
    - {{ pin_subpackage("pyopenms", max_pin="x.x") }}  

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - cmake
    - sysroot_linux-64 =2.17 # [linux]
    - ninja
    - pytest
  host:
    - eigen >=3.3.4
    - libopenms >={{ version }}
    - llvm-openmp # [osx]
    - xerces-c
    - qt6-main
    - python >=3.9,<3.12
    - cython >=0.25.2,<3.1
    - autowrap >=0.22.10
    - setuptools
    - wheel
    - pip
    - numpy >=1.23.*
    - pandas
    - matplotlib-base
    - sysroot_linux-64 =2.17 # [linux]
    - apache-arrow-proc =*=cpu
    - libparquet
    - pytest

  run: # run_exports in libopenms should take care of the libraries. But it does not because of bugs. So copy everthing again and again
    - libopenms >={{ version }}
    - llvm-openmp # [osx]
    - xerces-c
    - python
    - numpy >=1.23.*
    - pandas
    - matplotlib-base
    - sysroot_linux-64 =2.17 # [linux]
test:
  commands:
    - python -c "import pyopenms; print(pyopenms.__version__)"
    # We cant use the PYTHON variable since it does not exist on the biocontainer?!
    # TODO run the full test suite?

about:
  home: https://github.com/OpenMS/OpenMS
  license: BSD
  license_file: LICENSE
  summary: python bindings for OpenMS, an open-source software C++ library for LC-MS data management and analyses

extra:
  {% if 'dev' in version %}
  skip-lints:
    - uses_vcs_url
    - missing_hash
  {% endif %}
  identifiers:  
    - biotools:openms
    - doi:10.1038/nmeth.3959
